}

  height: var(--title-container-height);

  grid-column: 1;
  grid-row: 1;

  text-align: center;
}

}

  justify-content: center;
  align-items: center;
  position: relative;

}
@keyframes spin {
  to { transform: rotate(360deg); }
}

  display: none !important;
}
.error-icon {
  width: var(--icon-size);
  height: var(--icon-size);
  fill: var(--glyph-red);
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  clip-path: inset(50%);

  border: 0;

.apple-logo {

  height: var(--icon-size);

}

.footer-links {

  font-size: 12px;
  line-height: 1.33333;

.footer-links a {

  transition: color 0.2s ease;

.footer-links a:hover {

}
/* Remove focus outline completely */
*:focus {

}

    width: 100%;
  }

    font-size: 21px;
    line-height: 1.19048;
  }
