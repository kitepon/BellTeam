# Host-owned empty parent only. Never merge with the normal service Compose.
name: bellteam-state-prepare
services:
  state-prepare:
    image: ${BELLTEAM_SERVER_IMAGE:?select the accepted server image}
    pull_policy: never
    user: "0:0"
    entrypoint: [/usr/bin/env, -i, "PATH=/usr/local/bin:/usr/bin:/bin", /usr/local/bin/node, /app/src/server-state-prepare.mjs]
    command: []
    init: true
    read_only: true
    network_mode: none
    cap_drop: [ALL]
    cap_add: [CHOWN]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=64m
    volumes:
      - type: bind
        source: ${BELLTEAM_STATE_PARENT:?host owner must prepare the private parent}
        target: /srv/bellteam-state-parent
        bind:
          create_host_path: false
