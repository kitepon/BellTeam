name: 審査Dex通常候補の作成と配布
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: review-dex-candidate
  cancel-in-progress: false
jobs:
  candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE: dc237919508102d833683412c6215a505a58bef1
      BASE: ghcr.io/dexidp/dex:v2.45.1@sha256:8499afd690c437f52301efd2b05b2455da5bd2dfc20332cd697dc9937f808462
      IMAGE: ghcr.io/kitepon/bellteam-server
    steps:
      - uses: actions/checkout@v7
        with:
          ref: dc237919508102d833683412c6215a505a58bef1
          persist-credentials: false
      - name: 固定sourceから空contextでamd64候補を作成
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime/review-dex/context
          evidence=runtime/review-dex
          printf '%s\n' "$SOURCE" > "$evidence/source.txt"
          git show "$SOURCE:distribution/apple-review/sec021/Dockerfile.dex" > "$evidence/Dockerfile.dex"
          echo 'e993c4541edf5e52e2188dfb13279e2dedb89e08ea040eeade1b361d49aa964f  runtime/review-dex/Dockerfile.dex' | sha256sum -c -
          tag="$IMAGE:review-dex-dc237919-20261027-$GITHUB_RUN_ID-amd64"
          printf '%s\n' "$tag" > "$evidence/candidate-tag.txt"
          docker pull --platform linux/amd64 "$BASE" > "$evidence/base-pull.stdout" 2> "$evidence/base-pull.stderr"
          docker image inspect "$BASE" > "$evidence/base-image.json"
          docker build --pull --no-cache --platform linux/amd64 -f "$evidence/Dockerfile.dex" \
            --label org.opencontainers.image.source=https://github.com/kitepon/BellTeam \
            --label "org.opencontainers.image.revision=$SOURCE" -t "$tag" "$evidence/context" \
            > "$evidence/build.stdout" 2> "$evidence/build.stderr"
          docker image inspect "$tag" > "$evidence/image-built.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          p=Path("runtime/review-dex")
          base=json.loads((p/"base-image.json").read_text())[0]
          image=json.loads((p/"image-built.json").read_text())[0]
          assert image["Os"]=="linux" and image["Architecture"]=="amd64"
          for key in ("User","Entrypoint","Cmd"):
              assert image["Config"][key]==base["Config"][key], key
          assert image["Config"]["User"]=="dex:dex"
          assert image["Config"]["Labels"]["org.opencontainers.image.revision"]==os.environ["SOURCE"]
          (p/"image-id.txt").write_text(image["Id"]+"\n")
          PY
      - name: 同localIDのOS根と版と通常TLSを受入
        shell: bash
        run: |
          set -euo pipefail
          evidence=runtime/review-dex
          id=$(cat "$evidence/image-id.txt")
          docker run --pull never --rm --network none --read-only --cap-drop ALL \
            --entrypoint /bin/cat "$id" /etc/ssl/certs/ca-certificates.crt \
            > "$evidence/ca-certificates.crt" 2> "$evidence/ca.stderr"
          openssl crl2pkcs7 -nocrl -certfile "$evidence/ca-certificates.crt" \
            | openssl pkcs7 -print_certs -noout > "$evidence/ca-subjects.txt"
          ! grep -F 'emSign ECC Root CA - G3' "$evidence/ca-subjects.txt"
          ! grep -F 'AAA Certificate Services' "$evidence/ca-subjects.txt"
          grep -F 'emSign Root CA - G1' "$evidence/ca-subjects.txt"
          docker run --pull never --rm --network none --read-only --cap-drop ALL \
            --entrypoint /usr/local/bin/dex "$id" version > "$evidence/version.stdout" 2> "$evidence/version.stderr"
          grep -F v2.45.1 "$evidence/version.stdout"
          for ref in "$BASE" "$id"; do
            docker run --pull never --rm --network none --read-only --cap-drop ALL \
              --entrypoint /bin/sh "$ref" -c 'sha256sum /usr/local/bin/dex /usr/local/bin/docker-entrypoint'
          done > "$evidence/binary-hashes.txt"
          test "$(head -2 "$evidence/binary-hashes.txt")" = "$(tail -2 "$evidence/binary-hashes.txt")"
          docker run --pull never --rm --read-only --cap-drop ALL --memory 256m --pids-limit 128 \
            --entrypoint /usr/bin/wget "$id" -S -O /dev/null https://www.debian.org/ \
            > "$evidence/tls.stdout" 2> "$evidence/tls.stderr"
      - name: 合成memory設定だけでOIDC discoveryを受入
        shell: bash
        run: |
          set -euo pipefail
          evidence=runtime/review-dex
          id=$(cat "$evidence/image-id.txt")
          cat > "$evidence/config.yaml" <<'YAML'
          issuer: http://127.0.0.1:5556
          storage:
            type: memory
          web:
            http: 0.0.0.0:5556
          enablePasswordDB: true
          staticPasswords: []
          YAML
          chmod 644 "$evidence/config.yaml"
          docker run --pull never -d --read-only --cap-drop ALL --memory 256m --cpus 1 --pids-limit 128 \
            -p 127.0.0.1:5556:5556 \
            --mount "type=bind,source=$PWD/$evidence/config.yaml,target=/etc/dex/config.yaml,readonly" \
            "$id" dex serve /etc/dex/config.yaml > "$evidence/cid.txt"
          for attempt in $(seq 1 30); do
            if curl --connect-timeout 2 --max-time 3 -fsS http://127.0.0.1:5556/.well-known/openid-configuration \
              > "$evidence/discovery-$attempt.json" 2> "$evidence/discovery-$attempt.stderr"; then
              cp "$evidence/discovery-$attempt.json" "$evidence/discovery.json"
              break
            fi
            sleep 2
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("runtime/review-dex/discovery.json").read_text())
          assert d["issuer"]=="http://127.0.0.1:5556"
          for key in ("authorization_endpoint","token_endpoint","jwks_uri"):
              assert d[key].startswith("http://127.0.0.1:5556/")
          PY
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v4
      - name: 受入済み同IDの候補tagだけ公開し原本を保存
        shell: bash
        run: |
          set -euo pipefail
          evidence=runtime/review-dex
          id=$(cat "$evidence/image-id.txt")
          tag=$(cat "$evidence/candidate-tag.txt")
          docker image inspect "$tag" > "$evidence/image-before-push.json"
          test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$id"
          docker push "$tag" > "$evidence/push.stdout" 2> "$evidence/push.stderr"
          docker image inspect "$id" > "$evidence/image-published.json"
          digest=$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' "$evidence/push.stdout")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          ref="$IMAGE@$digest"
          printf '%s\n' "$ref" > "$evidence/published-ref.txt"
          docker buildx imagetools inspect "$ref" > "$evidence/manifest-info.stdout"
          docker buildx imagetools inspect --raw "$ref" > "$evidence/manifest.json"
          docker buildx imagetools inspect --format '{{json .Image}}' "$ref" > "$evidence/registry-image.json"
          python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          p=Path("runtime/review-dex")
          manifest=(p/"manifest.json").read_bytes()
          ref=(p/"published-ref.txt").read_text().strip()
          digest=re.search(r"^Digest:\s+(sha256:[0-9a-f]{64})$", (p/"manifest-info.stdout").read_text(), re.M).group(1)
          assert ref.endswith("@"+digest)
          d=json.loads(manifest)
          assert d["config"]["digest"]==(p/"image-id.txt").read_text().strip()
          image=json.loads((p/"registry-image.json").read_text())
          assert image["os"]=="linux" and image["architecture"]=="amd64"
          assert image["config"]["Labels"]["org.opencontainers.image.revision"]==os.environ["SOURCE"]
          PY
      - name: 自分の合成コンテナだけ結果保存と片付け
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence=runtime/review-dex
          if test -s "$evidence/cid.txt"; then
            cid=$(cat "$evidence/cid.txt")
            docker logs "$cid" > "$evidence/dex.stdout" 2> "$evidence/dex.stderr"
            docker stop --time 10 "$cid" > "$evidence/stop.stdout"
            docker inspect "$cid" > "$evidence/container-ended.json"
            docker rm "$cid" > "$evidence/rm.stdout"
          fi
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("runtime/review-dex")
          rows=[{"path":str(f.relative_to(p)),"sha256":hashlib.sha256(f.read_bytes()).hexdigest(),"size":f.stat().st_size} for f in sorted(p.rglob("*")) if f.is_file()]
          (p/"artifact-index.json").write_text(json.dumps(rows,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-dex-amd64-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/review-dex/
          if-no-files-found: error
          retention-days: 14
