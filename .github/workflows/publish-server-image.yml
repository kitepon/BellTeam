name: BugHub説明のみの本番base派生候補（手動専用）
on:
  workflow_dispatch:
    inputs:
      backport_source:
        description: Rootが固定した本番base限定backport40hex SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: centi-bughub-backport-once
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/ci/centi-bughub-backport-20261026' && github.run_attempt == 1
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      BACKPORT_SOURCE: ${{ inputs.backport_source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: CI境界だけの小人工
        run: python3 -B -m unittest discover -s .ci/bughub-backport -p test_backport.py -v
      - name: immutable本番baseと説明module一枚だけ・隔離metadata
        timeout-minutes: 21
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: timeout --signal=TERM --kill-after=10s 1230s python3 -B .ci/bughub-backport/candidate.py build ${{ matrix.arch }}
      - uses: docker/login-action@v4
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/security-registry-auth
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 確認済み一候補arch tagだけ登録し匿名binding
        timeout-minutes: 5
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          DOCKER_CONFIG: ${{ runner.temp }}/security-registry-auth
        run: timeout --signal=TERM --kill-after=10s 270s python3 -B .ci/bughub-backport/candidate.py publish ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 3
        with:
          name: bughub-backport-${{ github.run_id }}-${{ matrix.arch }}
          path: |
            .ci/bughub-backport/output/*.json
            .ci/bughub-backport/output/*.log
            .ci/bughub-backport/output/*.claim
          if-no-files-found: error
          retention-days: 14
  candidate:
    needs: build
    if: github.ref == 'refs/heads/ci/centi-bughub-backport-20261026' && github.run_attempt == 1
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BACKPORT_SOURCE: ${{ inputs.backport_source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: bughub-backport-${{ github.run_id }}-*
          path: incoming
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/security-registry-auth
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: exact両archから固有候補indexと匿名5原文bindingだけ
        timeout-minutes: 8
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          DOCKER_CONFIG: ${{ runner.temp }}/security-registry-auth
        run: timeout --signal=TERM --kill-after=10s 450s python3 -B .ci/bughub-backport/candidate.py index
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 2
        with:
          name: bughub-backport-${{ github.run_id }}-index
          path: |
            .ci/bughub-backport/output/*.json
            .ci/bughub-backport/output/*.log
            .ci/bughub-backport/output/*.claim
          if-no-files-found: error
          retention-days: 14
