# Optional: use after the existing BellTeam installation has been prepared.
# Both services remain independently startable; neither has depends_on.
services:
  bellteam:
    environment:
      BELLTEAM_CALL_BRIDGE_MCP_URL: http://call-bridge:18910/mcp
      BELLTEAM_CALL_BRIDGE_SOCKET: /srv/bellteam/state/call-bridge-socket/bellteam.sock
  call-bridge:
    environment:
      CALL_BRIDGE_ALLOWED_HOSTS: "${CALL_BRIDGE_ALLOWED_HOSTS:-127.0.0.1:*,localhost:*},call-bridge:18910"
      CALL_BRIDGE_BELLTEAM_UNIX: /run/bellteam/bellteam.sock
    volumes:
      - type: volume
        source: server-state
        target: /run/bellteam
        read_only: true
        volume:
          nocopy: true
          subpath: state/call-bridge-socket
volumes:
  server-state:
    external: true
    name: ${BELLTEAM_SERVER_STATE_VOLUME:-bellteam-server-state}
