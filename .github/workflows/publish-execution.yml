{
  "name": "execution専用archiveとOIDC provenanceを作る",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read",
    "id-token": "write",
    "attestations": "write"
  },
  "concurrency": {
    "group": "execution-artifact",
    "cancel-in-progress": false
  },
  "jobs": {
    "package": {
      "if": "github.repository == 'kitepon/BellTeam' && github.ref == 'refs/heads/main'",
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "arch": "amd64",
              "runner": "ubuntu-24.04"
            },
            {
              "arch": "arm64",
              "runner": "ubuntu-24.04-arm"
            }
          ]
        }
      },
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 15,
      "env": {
        "ARCH": "${{ matrix.arch }}",
        "SOURCE": "${{ github.sha }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@v7",
          "with": {
            "node-version": "26"
          }
        },
        {
          "name": "固定main sourceからexecutionのclean production依存とarchiveを作る",
          "run": "python3 test/execution-artifact.test.py\npython3 - <<'PYTHON'\nimport os,platform,re,subprocess\nassert re.fullmatch('[a-f0-9]{40}',os.environ['SOURCE'])\nassert {'x86_64':'amd64','aarch64':'arm64'}[platform.machine()] == os.environ['ARCH']\nassert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == os.environ['SOURCE']\nPYTHON\nmkdir -p runtime/execution\npython3 scripts/package-execution.py \"runtime/execution/execution-$SOURCE-linux-$ARCH.tar.gz\" --source \"$SOURCE\" --arch \"$ARCH\" > runtime/execution/package-result.json\n"
        },
        {
          "name": "固定archiveの実factoryとassetをUID1001で起動・退役・復元して確認",
          "run": "archive=\"runtime/execution/execution-$SOURCE-linux-$ARCH.tar.gz\"\nsudo python3 test/helpers/execution-artifact-probe.py \"$archive\" \"$(command -v node)\"\n"
        },
        {
          "name": "archiveの公式OIDC attestationを生成",
          "id": "attest",
          "uses": "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6",
          "with": {
            "subject-path": "runtime/execution/*.tar.gz",
            "create-storage-record": false
          }
        },
        {
          "name": "公式verifierでidentityとsourceを確認してbundleを保存",
          "env": {
            "BUNDLE": "${{ steps.attest.outputs.bundle-path }}"
          },
          "run": "archive=\"runtime/execution/execution-$SOURCE-linux-$ARCH.tar.gz\"\ngh attestation verify \"$archive\" --repo kitepon/BellTeam --signer-workflow kitepon/BellTeam/.github/workflows/publish-execution.yml --source-ref refs/heads/main --source-digest \"$SOURCE\" --signer-digest \"$SOURCE\" --deny-self-hosted-runners --bundle \"$BUNDLE\" --custom-trusted-root config/web-gateway-trusted-root.jsonl --format json > runtime/execution/verified.json\njq -e 'length > 0 and all(.[]; .verificationResult.signature.certificate.sourceRepositoryIdentifier == \"1404510084\")' runtime/execution/verified.json\ncp \"$BUNDLE\" \"$archive.sigstore.json\"\n"
        },
        {
          "name": "固定421d配送method sidecarを同mainから生成して検査",
          "run": "archive=\"runtime/execution/live-delivery-$SOURCE-linux-$ARCH.tar.gz\"\npython3 runtime-live-delivery-adoption/package.py --source \"$SOURCE\" --arch \"$ARCH\" --output \"$archive\" > runtime/execution/live-delivery-package-result.json\npython3 runtime-live-delivery-adoption/package.py --check \"$archive\" --source \"$SOURCE\" --arch \"$ARCH\" > runtime/execution/live-delivery-check.json\n"
        },
        {
          "name": "固定配送method sidecarを別subjectとして同OIDCで署名",
          "id": "live_delivery_attest",
          "uses": "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6",
          "with": {
            "subject-path": "runtime/execution/live-delivery-${{ github.sha }}-linux-${{ matrix.arch }}.tar.gz",
            "create-storage-record": false
          }
        },
        {
          "name": "固定配送method sidecarの公式署名と閉manifestを検証",
          "env": {
            "BUNDLE": "${{ steps.live_delivery_attest.outputs.bundle-path }}"
          },
          "run": "archive=\"runtime/execution/live-delivery-$SOURCE-linux-$ARCH.tar.gz\"\ncp \"$BUNDLE\" \"$archive.sigstore.json\"\npython3 runtime-live-delivery-adoption/verify.py \"$archive\" \"$archive.sigstore.json\" --source \"$SOURCE\" --signer \"$SOURCE\" --arch \"$ARCH\" > runtime/execution/live-delivery-verified.json\n"
        },
        {
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "execution-${{ matrix.arch }}-${{ github.run_attempt }}",
            "path": "runtime/execution/",
            "if-no-files-found": "error"
          }
        },
        {
          "name": "署名前失敗の診断原本を保存",
          "if": "failure()",
          "uses": "actions/upload-artifact@v7",
          "with": {
            "name": "execution-execution-${{ matrix.arch }}-${{ github.run_attempt }}",
            "path": "runtime/execution/entry-probe.*",
            "if-no-files-found": "ignore",
            "retention-days": 7
          }
        }
      ]
    }
  }
}
