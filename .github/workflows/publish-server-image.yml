name: 新security依存とMCP入力制限のFull一回（CI専用）
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: centi-security-full-only
  cancel-in-progress: false
jobs:
  security-full:
    if: github.ref == 'refs/heads/ci/centi-security-full-20261026' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: CI adapterの小人工だけ
        run: python3 -B -m unittest discover -s .ci/security-full -p test_run.py -v
      - name: 固定新sourceの依存導入とFull一回
        timeout-minutes: 20
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: timeout --signal=TERM --kill-after=10s 1200s python3 -B .ci/security-full/run.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 3
        with:
          name: security-full-${{ github.run_id }}
          path: |
            .ci/security-full/output/*.json
            .ci/security-full/output/*.log
            .ci/security-full/output/*.claim
          if-no-files-found: error
          retention-days: 14
