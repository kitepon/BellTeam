name: Publish Linux app
# Builds the Linux app from the default branch and replaces the downloads of the rolling release "linux-app".
# The release never becomes Latest: Latest is the server update catalog (scripts/container-update-host.py).
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-linux-app
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Require the default branch
        run: test "$GITHUB_REF" = "refs/heads/${{ github.event.repository.default_branch }}"
      - name: Install the .NET 10 SDK
        run: |
          curl -fsSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 --install-dir "$HOME/.dotnet"
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
      - name: Test
        run: dotnet test linux/BellTeam.Linux.slnx -c Release
      - name: Package
        run: scripts/package-linux-app.sh dist
      - name: Publish the rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' linux/BellTeam.Linux/BellTeam.Linux.csproj | head -1)"
          notes="BellTeam Linux app $version from $GITHUB_SHA. Install or update: curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/download/linux-app/install-linux.sh | sh"
          if gh release view linux-app >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/linux-app" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release upload linux-app dist/* --clobber
            gh release edit linux-app --title "BellTeam Linux app $version" --notes "$notes" --latest=false --prerelease=false
          else
            gh release create linux-app dist/* --target "$GITHUB_SHA" --title "BellTeam Linux app $version" --notes "$notes" --latest=false
          fi
