{
  "name": "固定H1候補の席切替stderrをrun tmpfs二条件で診断",
  "on": {
    "workflow_dispatch": {
      "inputs": {
        "digest": {
          "description": "検査する既作成candidate index SHA256 digest",
          "required": true,
          "type": "string"
        },
        "source": {
          "description": "candidate imageに記録した40文字source SHA",
          "required": true,
          "type": "string"
        }
      }
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "h1-seat-stderr-diagnostic",
    "cancel-in-progress": false
  },
  "jobs": {
    "runtime": {
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "include": [
            {
              "arch": "amd64",
              "runner": "ubuntu-24.04"
            },
            {
              "arch": "arm64",
              "runner": "ubuntu-24.04-arm"
            }
          ]
        }
      },
      "runs-on": "${{ matrix.runner }}",
      "timeout-minutes": 20,
      "env": {
        "IMAGE": "ghcr.io/kitepon/bellteam-server@${{ inputs.digest }}",
        "EXPECTED_DIGEST": "${{ inputs.digest }}",
        "EXPECTED_SOURCE": "${{ inputs.source }}",
        "ARCH": "${{ matrix.arch }}",
        "RESULT_DIR": "runtime/h1-runtime-${{ matrix.arch }}"
      },
      "steps": [
        {
          "uses": "actions/checkout@v7",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "name": "入力を検証して同じimmutable候補だけ取得",
          "run": "python3 - <<'PY'\nimport os,re\nassert re.fullmatch(r'sha256:[a-f0-9]{64}',os.environ['EXPECTED_DIGEST'])\nassert re.fullmatch(r'[a-f0-9]{40}',os.environ['EXPECTED_SOURCE'])\nassert os.environ['ARCH'] in ['amd64','arm64']\nPY\ndocker pull --platform \"linux/$ARCH\" \"$IMAGE\"\npython3 - <<'PY'\nimport json,os,subprocess\nimage=json.loads(subprocess.check_output(['docker','image','inspect',os.environ['IMAGE']]))[0]\nassert image['Os']=='linux' and image['Architecture']==os.environ['ARCH']\nassert image['Config']['Labels']['org.opencontainers.image.revision']==os.environ['EXPECTED_SOURCE']\nassert 'ghcr.io/kitepon/bellteam-server@'+os.environ['EXPECTED_DIGEST'] in image['RepoDigests']\nPY"
        },
        {
          "name": "席切替のstdout・stderr・exitを二条件で保存",
          "timeout-minutes": 3,
          "run": "python3 - <<'PYTHON'\nimport json, os, subprocess\nfrom pathlib import Path\nout = Path(os.environ['RESULT_DIR'])\nout.mkdir(parents=True, exist_ok=True)\nnode = r\"\"\"const {spawnSync}=require('node:child_process');\nconst r=spawnSync('sudo',['-n','--','/usr/local/libexec/bellteam-seat-exec','--','/usr/local/bin/node','/app/src/run-seat-command.mjs','/tmp','--base-environment','--resume-state-base','--','/usr/local/bin/node','-e','process.stdout.write(\"SEAT_DIAGNOSTIC_OK\\\\n\")'],{encoding:'utf8',timeout:15000,maxBuffer:65536});\nprocess.stdout.write(JSON.stringify({status:r.status,signal:r.signal,stdout:r.stdout,stderr:r.stderr,error:r.error?.code??null})+'\\n');\n\"\"\"\nfor with_run in [False, True]:\n    case = 'with-run' if with_run else 'without-run'\n    name = 'h1-seat-stderr-' + os.environ['GITHUB_RUN_ID'] + '-' + case\n    args = ['docker','run','--rm','--name',name,'--network','none','--read-only','--user','1001:1001','--tmpfs','/tmp:size=64m']\n    if with_run:\n        args += ['--tmpfs','/run:size=64m']\n    args += ['--tmpfs','/run/bellteam-server:uid=1001,gid=1001,mode=0700','--entrypoint','/usr/local/bin/node',os.environ['IMAGE'],'-e',node]\n    result = {'case':case,'image':os.environ['IMAGE'],'source':os.environ['EXPECTED_SOURCE'],'arch':os.environ['ARCH']}\n    try:\n        r = subprocess.run(args, capture_output=True, text=True, timeout=30)\n        result.update(dockerExit=r.returncode,dockerStdout=r.stdout,dockerStderr=r.stderr)\n        if r.returncode == 0:\n            result['seat'] = json.loads(r.stdout)\n    finally:\n        c = subprocess.run(['docker','rm','-f',name], capture_output=True, text=True, timeout=20)\n        result['cleanupExit'] = c.returncode\n        result['cleanupStderr'] = c.stderr\n        (out / (case + '.json')).write_text(json.dumps(result,indent=2)+'\\n')\n    assert r.returncode == 0\nPYTHON"
        },
        {
          "uses": "actions/upload-artifact@v7",
          "if": "always()",
          "with": {
            "name": "h1-runtime-${{ matrix.arch }}-${{ github.run_attempt }}",
            "path": "runtime/h1-runtime-${{ matrix.arch }}/",
            "if-no-files-found": "error"
          }
        }
      ]
    }
  }
}
