services:
  bellteam:
    image: ${BELLTEAM_SERVER_IMAGE:-ghcr.io/kitepon/bellteam-server:latest}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    init: true
    stdin_open: true
    tty: true
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:exec,size=8g
      - /run:size=64m
      - /run/bellteam-server:uid=1001,gid=1001,mode=0700,size=64m
    environment:
      BELLTEAM_CF_TEAM_DOMAIN: ${BELLTEAM_CF_TEAM_DOMAIN:-}
      BELLTEAM_CF_AUD: ${BELLTEAM_CF_AUD:-}
      BELLTEAM_BUGHUB_KEY: ${BELLTEAM_BUGHUB_KEY:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      BELLTEAM_SUBSCRIPTION_ENVIRONMENT: ${BELLTEAM_SUBSCRIPTION_ENVIRONMENT:-Production}
      BELLTEAM_CALL_BRIDGE_SOCKET: /srv/bellteam/state/call-bridge-socket/bellteam.sock
      BELLTEAM_CALL_BRIDGE_MCP_URL: ${BELLTEAM_CALL_BRIDGE_MCP_URL:-}
    ports:
      - "${BELLTEAM_BIND_IP:-0.0.0.0}:18891:4180"
      - "${BELLTEAM_BIND_IP:-0.0.0.0}:18892:4182"
    volumes:
      - ./runtime/home:/home/bell
      - cursor-cli:/home/bell/.local
      - type: bind
        source: ./runtime/data
        target: /srv/bellteam
        bind:
          create_host_path: false
      - type: volume
        source: server-state
        target: /run/bellteam-maintenance
        read_only: true
        volume:
          nocopy: true
      - type: volume
        source: server-state
        target: /srv/bellteam/state
        volume:
          nocopy: true
          subpath: state
      - type: volume
        source: server-state
        target: /srv/bellteam/rooms
        volume:
          nocopy: true
          subpath: rooms
      - type: volume
        source: server-state
        target: /srv/bellteam/owner
        volume:
          nocopy: true
          subpath: owner
      - type: volume
        source: server-state
        target: /srv/bellteam/logs
        volume:
          nocopy: true
          subpath: logs
      - type: volume
        source: server-state
        target: /srv/bellteam/shared/tools/bellteam-settings
        volume:
          nocopy: true
          subpath: bellteam-settings
      - type: volume
        source: server-state
        target: /srv/bellteam/shared/tools/apns
        volume:
          nocopy: true
          subpath: apns
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4180/healthz').then(r=>{if(!r.ok)throw Error(r.status)})"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  cursor-cli:
  server-state:
    external: true
    name: ${BELLTEAM_SERVER_STATE_VOLUME:-bellteam-server-state}
