name: 固定c5実物の単発受入（branch専用・配布なし）

on:
  workflow_dispatch:

concurrency:
  group: centi-c5a20bd3-artifact-acceptance
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  acceptance:
    if: github.ref == 'refs/heads/ci/centi-c5a20bd3-acceptance-20261026' && github.run_attempt == 1
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 既存の固定imageだけを匿名取得して必要差分を確認
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          python3 -m unittest discover -s .ci/c5-acceptance -p 'test_ci.py' -v
          python3 .ci/c5-acceptance/accept.py '${{ matrix.arch }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: c5-acceptance-${{ matrix.arch }}-${{ github.run_id }}
          path: |
            .ci/c5-acceptance/output/*.json
            .ci/c5-acceptance/output/*.log
            .ci/c5-acceptance/output/*.stderr
          if-no-files-found: error
          retention-days: 14
