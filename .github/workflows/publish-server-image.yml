name: 固定c5 helper caps・Compose実互換（単発案）
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: centi-c5-helpercaps-only
  cancel-in-progress: false
jobs:
  helper-compatibility:
    if: github.ref == 'refs/heads/ci/centi-c5-helpercaps-20261026' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: 固定source・資源・一時資材の入口確認とhelper限定実行
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          python3 -m unittest discover -s .ci/c5-helper -p test_executor.py -v
          python3 .ci/c5-helper/accept_helpers.py --contract .ci/c5-helper/contract.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: c5-helper-compatibility-${{ github.run_id }}
          path: |
            .ci/c5-helper/output/*.json
            .ci/c5-helper/output/*.log
          if-no-files-found: error
          retention-days: 14
