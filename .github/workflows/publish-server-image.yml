name: 固定c5 v16下位経路と実形式（単発CI専用）
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: centi-c5-lower-only
  cancel-in-progress: false
jobs:
  lower-compatibility:
    if: github.ref == 'refs/heads/ci/centi-c5-lower-v16-20261026' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: CI adapterだけの新小人工
        run: python3 -B -m unittest discover -s .ci/c5-lower -p test_harness.py -v
      - name: 下位関数と自己fixtureの実形式のみ
        timeout-minutes: 20
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python3 -B .ci/c5-lower/run.py --contract .ci/c5-lower/contract.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        timeout-minutes: 3
        with:
          name: c5-lower-compatibility-${{ github.run_id }}
          path: |
            .ci/c5-lower/output/*.json
            .ci/c5-lower/output/*.log
            .ci/c5-lower/output/*.claim
          if-no-files-found: error
          retention-days: 14
