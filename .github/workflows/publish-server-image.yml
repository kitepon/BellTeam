name: Security新mainの限定両arch候補（手動専用）
on:
  workflow_dispatch:
    inputs:
      source:
        description: Rootがskip ciで通常統合した正規mainの40hex SHA
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: centi-security-image-once
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/ci/centi-security-image-20261026' && github.run_attempt == 1
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 55
    env:
      PRODUCT_SOURCE: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: node
      - name: CI境界だけの小人工
        run: python3 -B -m unittest discover -s .ci/security-image -p test_candidate.py -v
      - name: 正規mainの公式latest no-cache buildと新guard/inventoryだけ
        timeout-minutes: 45
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: timeout --signal=TERM --kill-after=10s 2700s python3 -B .ci/security-image/candidate.py build ${{ matrix.arch }}
      - uses: docker/login-action@v4
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/security-registry-auth
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 確認済み一候補arch tagだけ登録し匿名binding
        timeout-minutes: 5
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          DOCKER_CONFIG: ${{ runner.temp }}/security-registry-auth
        run: timeout --signal=TERM --kill-after=10s 240s python3 -B .ci/security-image/candidate.py publish ${{ matrix.arch }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 3
        with:
          name: security-image-${{ github.run_id }}-${{ matrix.arch }}
          path: |
            .ci/security-image/output/*.json
            .ci/security-image/output/*.log
            .ci/security-image/output/*.claim
          if-no-files-found: error
          retention-days: 14
  candidate:
    needs: build
    if: github.ref == 'refs/heads/ci/centi-security-image-20261026' && github.run_attempt == 1
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PRODUCT_SOURCE: ${{ inputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: security-image-${{ github.run_id }}-*
          path: incoming
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/security-registry-auth
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: exact両archから固有候補indexと匿名5原文bindingだけ
        timeout-minutes: 7
        env:
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          DOCKER_CONFIG: ${{ runner.temp }}/security-registry-auth
        run: timeout --signal=TERM --kill-after=10s 420s python3 -B .ci/security-image/candidate.py index
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        timeout-minutes: 2
        with:
          name: security-image-${{ github.run_id }}-index
          path: |
            .ci/security-image/output/*.json
            .ci/security-image/output/*.log
            .ci/security-image/output/*.claim
          if-no-files-found: error
          retention-days: 14
